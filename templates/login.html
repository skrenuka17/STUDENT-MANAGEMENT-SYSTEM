{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-deco">
    <div class="deco-circle c1"></div>
    <div class="deco-circle c2"></div>
    <div class="deco-circle c3"></div>
    <div class="login-tagline">
      <h1>EduTrack</h1>
      <p>Student Course Management System</p>
      <div class="login-pills">
        <span>📊 Dashboard</span>
        <span>📚 Courses</span>
        <span>🎯 Attendance</span>
        <span>📈 Reports</span>
      </div>
    </div>
  </div>

  <div class="login-card">
    <div class="login-logo">🎓</div>
    <h2 class="login-heading">Welcome back</h2>
    <p class="login-sub">Sign in to your admin account</p>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/">
      <div class="field-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" autocomplete="username" required />
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary full-width">Sign In →</button>
    </form>

    <p class="login-hint">Default: <code>admin</code> / <code>1234</code></p>
  </div>
</div>
{% endblock %}
