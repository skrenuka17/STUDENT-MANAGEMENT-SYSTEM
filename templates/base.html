<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SCMS{% endblock %} — EduTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>

{% if session.user %}
<nav class="navbar">
  <div class="nav-brand">
    <span class="nav-icon">🎓</span>
    <span class="nav-title">EduTrack</span>
  </div>
  <ul class="nav-links">
    <li><a href="{{ url_for('dashboard') }}" class="{% if request.endpoint=='dashboard' %}active{% endif %}">Dashboard</a></li>
    <li><a href="{{ url_for('students') }}" class="{% if request.endpoint in ['students','add_student','update_student','delete_student'] %}active{% endif %}">Students</a></li>
    <li><a href="{{ url_for('courses') }}" class="{% if request.endpoint=='courses' %}active{% endif %}">Courses</a></li>
    <li><a href="{{ url_for('enrollments') }}" class="{% if request.endpoint=='enrollments' %}active{% endif %}">Enrollments</a></li>
    <li><a href="{{ url_for('attendance') }}" class="{% if request.endpoint=='attendance' %}active{% endif %}">Attendance</a></li>
    <li><a href="{{ url_for('reports') }}" class="{% if request.endpoint=='reports' %}active{% endif %}">Reports</a></li>
  </ul>
  <a href="{{ url_for('logout') }}" class="btn-logout">Logout ↗</a>
</nav>
{% endif %}

<main class="main-content {% if not session.user %}no-nav{% endif %}">
  {% block content %}{% endblock %}
</main>

<div id="toast" class="toast hidden"></div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
